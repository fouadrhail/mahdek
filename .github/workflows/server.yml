name: server
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: server
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check keys
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CF" ] || [ -z "$ACC" ] || [ -z "$AK" ]; then
            echo "::warning::חסרים מפתחות: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Deploy to Cloudflare
        if: env.SKIP != '1'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            ANTHROPIC_API_KEY
          command: deploy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the server address for Mahdek
        if: env.SKIP != '1'
        env:
          OUT: ${{ steps.wr.outputs.command-output }}
          DURL: ${{ steps.wr.outputs.deployment-url }}
        run: |
          URL="$DURL"
          if [ -z "$URL" ]; then URL=$(printf '%s' "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1); fi
          if [ -z "$URL" ]; then echo "::warning::לא נמצאה כתובת השרת"; exit 0; fi
          printf '{"url":"%s","updated":"%s"}\n' "$URL" "$(date -u +%FT%TZ)" > data/server.json
          curl -fsS "$URL/" || true
          git config user.name "mahdek-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/server.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "כתובת השרת"
          git pull --rebase && git push
