name: Update rates
on:
  schedule:
    - cron: '50 13 * * 0-5'   # after the Bank of Israel publishes (15:15 Israel time; Fridays earlier)
    - cron: '10 15 * * 1'     # interest decision days are Mondays, 16:00 Israel time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-rates.mjs', '.github/workflows/rates.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-rates.mjs
      - name: Save if changed
        run: |
          git config user.name "mahdek-bot"
          git config user.email "mahdek-bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git push)
